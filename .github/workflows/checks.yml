name: Checks

# Checks that need no game files: the game configuration, the settings schema and its generated guide.
# Building the app needs the player's own game, so it happens only on the player's Mac (./setup.sh).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The kit pins numpy 2.0.2, which has wheels up to Python 3.12.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r kit/requirements-dev.txt
      - name: Game configuration and settings
        run: |
          .venv/bin/python -m pytest -q tests
          .venv/bin/python tools/check_settings.py .
          .venv/bin/python tools/setup_kit/settings_doc.py --check
      - name: Core mod compiles
        run: clang -fsyntax-only -std=gnu11 -D_GNU_SOURCE -Ikit/mods mods/core/nfsmw/nfsmw.c
