# Lamp classes for the module F converter (Test113). Clean-room Module F.1, 5 Oct 2026.
# Every value here is [T] (clean implementer's choice). No console data.
#
# This file REPLACES the provisional class file.
#
# Anchors: given explicitly per class, in the class's local space (metres, z up). They
# were computed from the PC class boxes in packet item 3 with this rule:
#   - armed lamps (arm = -ly_min > 1.5): (x_centre, ly_min + 0.4, lz_max - 0.5)
#     (head at the arm tip, slightly inboard and below the top of the box);
#   - standing lamps and posts symmetric in y (no single arm): (x_centre, y_centre, lz_max - 0.5)
#     (lz_max - 0.4 for the short park/iron/J lamps);
#   - tunnel fixtures and other flat or box-mounted fittings: the box centre.
# anchor_source = "clean_manual_pc_visual" is the converter's key for "use the explicit
# anchor"; here the anchors come from the rule above, not from a visual check.
# Double-arm posts (LightPostA/B) get one light at the post centre with a wider radius.
#
# Light model fields (per class):
#   color     = normalised tint (max component 1)
#   intensity = peak pool contribution as a fraction of the surface albedo at d = 0
#               (before activation); the shader multiplies colour x intensity x activation
#   radius    = metres; the contribution is exactly 0 at and beyond it
#   falloff   = softening distance d0 in metres: the light is at half its peak at distance
#               d0. For lamps it is close to the mounting height, so the road pool directly
#               below is about half the peak and spreads softly. The host passes it in
#               CleanPools[2i+1].w (F.1 request).

[activation]
# Factor per kind; the host multiplies colour x intensity by it when filling CleanPools.
# There is no PC lamp on/off signal and the world is mostly overcast daylight, so exterior
# lamps are kept faint. An added pool reads most where the base lighting is dark, so they
# show under bridges and in shade and stay almost invisible on sunlit roads. Tunnel and
# covered-area fittings run at full strength.
exterior = 0.30
tunnel = 1.00

[params]
# CleanPoolParams (global tunables, same for every draw):
#   x = distance-fade start (m), y = distance-fade end (m), z = global strength,
#   w = road normal-map weight (WORLDREFLECT), 0..1
fade_start = 40.0
fade_end = 70.0
strength = 1.0
road_normal_weight = 0.5
CleanPoolParams = [40.0, 70.0, 1.0, 0.5]

[selection]
# N = 8 lights per draw. Request (non-binding ruling allows it): among the lights whose
# radius sphere intersects the draw's bounds, take the ones NEAREST THE CAMERA first, so
# long tunnel and road draws keep their pools where the player is. Lights that drop out
# of the selection are far away and already faded (fade end 70 m). Box-centre order is
# acceptable if camera order is not practical.
max_lights = 8
order = "nearest_to_camera"

